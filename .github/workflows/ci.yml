name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    name: Format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv run --locked --only-dev ruff format --check --diff

  tests:
    name: Testsuite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked testsuite
