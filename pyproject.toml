[project]
name = "qiskit2pulser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "ugo.col", email = "ugo.col@epita.fr" }]
requires-python = ">=3.12"
dependencies = ["pulser>=1.9.1", "qiskit>=2.5.2"]

[project.scripts]
qiskit2pulser = "qiskit2pulser:main"
testsuite = "tests.testsuite:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qiskit2pulser", "tests"]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
markers = ["init: tests de mise en place"]
